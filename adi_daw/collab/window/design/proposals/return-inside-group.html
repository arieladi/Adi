const MC=document.createElement('canvas').getContext('2d');
function wrap(x,y,text,maxW,z,lh,o={}){MC.font=`${o.w||400} ${z}px "Segoe UI", Arial, sans-serif`;const words=text.split(' ');let line='',lines=[];

function drumHits(kind,bar,chorus,last){ // [beat, amplitude, decay in beats]
  if(kind==='kick')return(chorus?[0,1,2,2.5,3]:[0,1.5,2.5]).map(b=>[b,0.95,0.3]);
  if(kind==='snare'){let h=[[1,0.9,0.32],[3,0.9,0.32],[3.75,0.28,0.12]];if(last)h=[[1,0.9,0.32],[2.5,0.55,0.15],[2.75,0.6,0.15],[3,0.75,0.2],[3.25,0.8,0.2],[3.5,0.9,0.2],[3.75,0.95,0.25]];return h}
  let h=[];for(let k=0;k<8;k++)h.push([k*0.5,k%2?0.32:0.55,0.07]);if(chorus){h[3]=[1.5,0.5,0.32];h[7]=[3.5,0.5,0.32]}return h}
function env(tr,bar0,bars,name,r){const chorus=/Chorus/.test(name);
  if(tr.drum){const hits=[];for(let b=0;b<bars;b++)drumHits(tr.drum,b,chorus,b===bars-1&&bars>=8).forEach(([t,a,d])=>hits.push([b*4+t,a*(0.9+0.1*r()),d]));
    return t=>{let v=0;for(const[t0,a,d]of hits){if(t>=t0&&t<t0+d*6)v=Math.max(v,a*Math.exp(-(t-t0)/d))}return v}}
  if(tr.vox==='lead'){const syl=[];const phr=chorus?[[0,7],[8,15],[16,23],[24,31.5]]:[[0.5,6.5],[8.5,14],[16.5,22.5],[24.5,30]];
    phr.forEach(([a,b])=>{let t=a;while(t<b-0.3){const d=[0.5,0.5,1,0.5,0.75,1.5][Math.floor(r()*6)];const end=Math.min(b,t+d);syl.push([t,end,(chorus?0.72:0.55)+0.3*r()]);t=end+0.06}syl[syl.length-1][1]=b});
    return t=>{for(const[a,b,amp]of syl)if(t>=a&&t<b){const u=(t-a)/(b-a);return amp*Math.min(1,u*6)*Math.pow(Math.sin(Math.PI*Math.min(0.999,0.15+0.85*u)),0.5)*(b-a>1.2?1+0.06*Math.sin(t*18):1)}return 0.02}}
  if(tr.vox==='bv')return t=>{const u=(t%8)/8;return 0.08+0.55*Math.pow(Math.sin(Math.PI*u),0.7)*(1+0.05*Math.sin(t*9))};return()=>0}
function midiNotes(tr,bars,name){const chorus=/Chorus/.test(name),intro=/Intro/.test(name),out=[];
  for(let b=0;b<bars;b++){const c=b%4;
    if(tr.n==='Bass'){const r0=ROOT[c];(chorus?[0,0.5,1,1.5,2,2.5,3,3.5].map((t,k)=>[t,0.42,r0+(k===3||k===7?12:0)]):[[0,1.4,r0],[1.5,0.45,r0],[2,0.9,r0],[3,0.45,r0+12],[3.5,0.45,r0]]).forEach(([t,l,p])=>out.push([b*4+t,l,p]))}
    else if(tr.n==='Keys'){const rh=intro?[[0,3.8]]:chorus?[[0,1.4],[1.5,0.9],[2.5,1.4]]:[[0,1.8],[2,1.8]];rh.forEach(([t,l])=>VOI[c].forEach(p=>out.push([b*4+t,l,p])))}
    else if(tr.n==='Pads'){PAD[c].forEach(p=>out.push([b*4,3.9,p]))}}
  return out}
