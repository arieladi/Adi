function envVox(seed,len){const r=rng(seed),syl=[];

  return b=>{let e=0.015;for(const[t0,d,a]of syl){if(b>=t0&&b<=t0+d){const u=(b-t0)/d;e=Math.max(e,a*Math.min(1,u*10)*Math.pow(1-u,0.3)*(0.85+0.15*Math.sin(b*90)))}}return e}}
const envBv=b=>{const u=(b%2)/2;return 0.02+0.62*Math.pow(Math.sin(Math.PI*Math.min(1,u/0.94)),0.8)};
const envRise=b=>0.05+0.9*Math.pow(Math.min(1,b),2.2);
function notesFor(kind,len,bar0){const N=[];for(let b=0;b<len;b++){const c=chordAt(bar0+b);

// A menu: rows 20 high (Compact), separators 9; tick column at the left, keys or the arrow at the right.
// The row under the pointer, and an open parent row, take the language's pointer-over grey (C.edge);
// the accent marks only what is on (the tick).
const RH=20,SEP=9;
function menu(x,y,w,items,o={}){const h=8+items.reduce((a,it)=>a+(it==='-'?SEP:RH),0)+(o.foot||0);let g=shadow(R(x,y,w,h,C.panel,{r:8,s:C.grpEdge}));let yy=y+4;const rows={};
  items.forEach(it=>{if(it==='-'){g+=L(x+10,yy+SEP/2,x+w-10,yy+SEP/2,C.ctl);yy+=SEP;return}
    const[t,k,f={}]=it;rows[t]=yy;
    if(f.hot||f.open)g+=R(x+4,yy,w-8,RH,C.edge,{r:5});
    const col=f.dis?C.faint:C.text;
    if(f.tick)g+=P(`M${x+11} ${yy+10}l3.5 3.5l6.5 -7`,{s:C.acc,sw:2});
    g+=T(x+28,yy+14,t,{z:12,f:col});
    if(f.sub)g+=P(`M${x+w-17} ${yy+6}l4.5 4l-4.5 4`,{s:f.open?C.text:C.dim,sw:1.7});
    else if(k)g+=T(x+w-12,yy+14,k,{z:11,f:f.dis?C.faint:C.dim,a:'end'});
    yy+=RH});
  return{g,h,rows,end:yy}}
