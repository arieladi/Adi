<script>
// ADI, the built-in devices' panels, proposal 1 (28 November 2026). SC-455, after the director's second
// test: "it should look like Ableton utility, please". Seven devices, each laid out the way Live lays
// its own out, with the controls ADI's devices already declare (pd/devices/*.pd). ADI's own drawing.
const W=1920,H=1080;let s=R(0,0,W,H,C.win);
s+=T(20,30,'ADI  ·  the built-in devices, laid out as Live lays its own',{z:17,w:700});
s+=T(20,48,'Each panel keeps the controls the device has today. What changes is where they stand, their names, and a graph where Live has one. Drawn at 1.6 times the Device View. Numbers refer to the notes below.',{z:11.5,f:C.dim});

{const y=730;s+=L(20,y,1900,y,'#3a3a3a');

 const N=[
  ['1','One row high, in named sections.',['Every device is as tall as the Device View and reads left to right in sections,','as Live\'s do: input before output. No grid of unnamed knobs, nothing to scroll.']],
  ['2','A graph where Live has one, and it is the control.',['The filter curve, the EQ curve, the delay\'s filter, the reverb\'s pads: the dot is','dragged in the picture, and the dials beside it show the same values.']],
  ['3','EQ Eight is Live\'s EQ Eight.',['Eight numbered filters on one curve, the chosen one\'s Freq, Gain and Q at the','left, the eight cells under the curve, Mode, Edit A/B, Adaptive Q, Scale and Gain','at the right. Your own EQ is not this device (ADR-0266).']],
  ['4','A dial where Live has a dial, a switch where it has a switch.',['Delay\'s synced time is the row of numbered boxes, in sixteenths, as Live\'s.','A choice of a few words is a chooser; on and off is a lit switch.']],
  ['5','Each device keeps the controls it has.',['Nothing is removed or added to what a device can do. Controls that only matter','in one mode (Morph, the Color dials) are dimmed outside it, not hidden.']],
  ['6','One addition: the bands on a strip.',['Multiband Dynamics gets a strip across the top where the two band edges are','dragged, as you asked. Live sets them in two number boxes only. Under it the','three bands are Live\'s: level, the two threshold blocks, in and out.']],
 ];
