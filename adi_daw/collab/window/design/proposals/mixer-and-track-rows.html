// ADI, the track rows and the Mixer in detail, proposal 1 (19 November 2026). DF-W20; ADR-0243's order.

// section. Bottom: Live 12's Mixer in the lower panel. The Browser and the Info box are closed on this
// sheet to make room for the legend at the left.
// Second pass, after the critic: every meter, held-peak line, fader and value box is placed from its dB
// value on one scale, -60 to +6 dB; the moment drawn is a second after Bass's Solo was pressed.

s+=R(1652,2,262,20,C.acc,{r:5});s+=T(1783,17,'MIXER AND TRACK ROWS SHEET  ·  proposal 1',{z:11.5,w:700,a:'middle',f:C.ink});

// text measured in the browser, for the legend and the choosers
const MC=document.createElement('canvas').getContext('2d');
const fnt=(w,z)=>`${w} ${z}px "Segoe UI", Arial, sans-serif`;
function para(x,y,title,body,maxW,z,lh,o={}){MC.font=fnt(700,z);const tw=title?MC.measureText(title+'  ').width:0;MC.font=fnt(400,z);
  const words=body.split(' ');const lines=[];let line='';
  words.forEach(w=>{const t=line?line+' '+w:w;const lim=lines.length?maxW:maxW-tw;if(MC.measureText(t).width>lim&&line){lines.push(line);line=w}else line=t});if(line)lines.push(line);
  let g=title?T(x,y,title,{z,w:700,f:o.tf||C.text}):'';lines.forEach((l,k)=>g+=T(k?x:x+tw,y+k*lh,l,{z,f:o.f||C.text}));return{g,h:lines.length*lh}}
// a chooser's label cut as Live cuts it, with an ellipsis, when it would run into the chevron
const fit=(t,z,maxw)=>{MC.font=fnt(400,z);if(MC.measureText(t).width<=maxw)return t;while(t.length>1&&MC.measureText(t+'…').width>maxw)t=t.slice(0,-1);return t+'…'};

// the sheet's own boxes (not the window's): an orange dashed edge

// ---------------- one dB scale for the meter, its held peak, the fader and the volume box ----------------

const fmt=db=>db==null?'-inf':(db>0?'+':'')+db.toFixed(1);
const dbt=v=>v===0?'0.0':v.toFixed(1);

// ---------------- the song: Norway, C# minor, 120 BPM ----------------
const GD='#f08a5d';
const SDB={0:'-inf',0.248:'-35.0',0.575:'-17.0',0.857:'-5.7',1:'0.0'};    // the send taper, as measured in Live 12.4
// pk: the held peak in dB from before the solo (the box over the meter keeps it); now: the level a second after
// Bass's Solo, null where the track is silenced by the solo. Pan [knob 0..1, text], 50L..50R.
const TR=[
 {n:'Drums',c:GD,k:'g',h:44,num:'1',vol:-3.0,pk:-2.6,now:null,io:['Main'],to:'Main',sends:[0.248,0],pan:[0.5,'C'],dly:'0.00'},
 {n:'Kick',c:'#ff6f61',k:'a',h:44,num:'2',vol:-4.5,pk:0.4,now:null,lines:[GD],drum:'kick',io:['Ext. In','3','mon','Group'],in:['Ext. In','3'],to:'Group',sends:[0,0],pan:[0.5,'C'],dly:'0.00'},
 {n:'Snare',c:'#e8b04a',k:'a',h:44,num:'3',off:1,vol:-6.0,pk:null,now:null,lines:[GD],drum:'snare',io:['Ext. In','4','mon','Group'],in:['Ext. In','4'],to:'Group',sends:[0.575,0],pan:[0.42,'8L'],dly:'0.00'},
 {n:'Bass',c:'#f2e15a',k:'m',h:76,num:'4',solo:1,vol:-7.5,pk:-9.1,now:-13.0,io:['All Ins','All Channels','mon','Main'],in:['All Ins','All Channels'],to:'Main',sends:[0,0],pan:[0.5,'C'],dly:'-4.00'},
 {n:'Lead Vocals',c:'#5ec8ff',k:'a',h:92,num:'5',sel:1,arm:1,vol:-2.5,pk:-5.2,now:null,vox:'lead',io:['Ext. In','1/2','mon','Main'],in:['Ext. In','1/2'],to:'Main',sends:[0.575,0.857],pan:[0.5,'C'],dly:'0.00'},
];

 {n:'A Reverb',c:'#b7b7c2',k:'r',h:44,num:'A',vol:-9.0,pk:-14.6,now:-31.0,io:['Main'],to:'Main',sends:[0,0],sdis:[1,1],pan:[0.5,'C'],dly:'0.00'},
 {n:'B Delay',c:'#b7b7c2',k:'r',h:24,num:'B',vol:-12.0,pk:-18.9,now:-37.0,io:['Main'],to:'Main',sends:[0.248,0],sdis:[0,1],pan:[0.62,'12R'],dly:'0.00'},

];

TR[0].clips=[[1,4,'Drums Intro'],[5,8,'Drums Verse'],[13,8,'Drums Chorus'],[21,8,'Drums Verse 2']];
TR[1].clips=[[1,4,'Kick Intro'],[5,8,'Kick Verse'],[13,8,'Kick Chorus'],[21,8,'Kick Verse 2']];
TR[2].clips=[[5,8,'Snare Verse'],[13,8,'Snare Chorus'],[21,8,'Snare Verse 2']];
TR[3].clips=[[5,8,'Bass Verse'],[13,8,'Bass Chorus'],[21,8,'Bass Verse 2']];
TR[4].clips=[[5,8,'Lead Vox V1 tk3'],[13,8,'Lead Vox Ch tk1'],[21,8,'Lead Vox V2 tk2']];
// C#m, A, E, B: one chord a bar
const ROOT=[37,33,40,35];
function drumHits(kind,bar,chorus,last){ // [beat, amplitude, decay in beats]
  if(kind==='kick')return(chorus?[0,1,2,2.5,3]:[0,1.5,2.5]).map(b=>[b,0.95,0.3]);
  let h=[[1,0.9,0.32],[3,0.9,0.32],[3.75,0.28,0.12]];if(last)h=[[1,0.9,0.32],[2.5,0.55,0.15],[2.75,0.6,0.15],[3,0.75,0.2],[3.25,0.8,0.2],[3.5,0.9,0.2],[3.75,0.95,0.25]];return h}
function env(tr,bars,name,r){const chorus=/Ch/.test(name);
  if(tr.drum){const hits=[];for(let b=0;b<bars;b++)drumHits(tr.drum,b,chorus,b===bars-1&&bars>=8).forEach(([t,a,d])=>hits.push([b*4+t,a*(0.9+0.1*r()),d]));
    return t=>{let v=0;for(const[t0,a,d]of hits){if(t>=t0&&t<t0+d*6)v=Math.max(v,a*Math.exp(-(t-t0)/d))}return v}}
  if(tr.vox==='lead'){const syl=[];const phr=chorus?[[0,7],[8,15],[16,23],[24,31.5]]:[[0.5,6.5],[8.5,14],[16.5,22.5],[24.5,30]];
    phr.forEach(([a,b])=>{let t=a;while(t<b-0.3){const d=[0.5,0.5,1,0.5,0.75,1.5][Math.floor(r()*6)];const end=Math.min(b,t+d);syl.push([t,end,(chorus?0.72:0.55)+0.3*r()]);t=end+0.06}syl[syl.length-1][1]=b});
    return t=>{for(const[a,b,amp]of syl)if(t>=a&&t<b){const u=(t-a)/(b-a);return amp*Math.min(1,u*6)*Math.pow(Math.sin(Math.PI*Math.min(0.999,0.15+0.85*u)),0.5)*(b-a>1.2?1+0.06*Math.sin(t*18):1)}return 0.02}}
  return()=>0}
function bassNotes(bars,name){const chorus=/Chorus/.test(name),out=[];
  for(let b=0;b<bars;b++){const r0=ROOT[b%4];(chorus?[0,0.5,1,1.5,2,2.5,3,3.5].map((t,k)=>[t,0.42,r0+(k===3||k===7?12:0)]):[[0,1.4,r0],[1.5,0.45,r0],[2,0.9,r0],[3,0.45,r0+12],[3.5,0.45,r0]]).forEach(([t,l,p])=>out.push([b*4+t,l,p]))}
  return out}

// ---------------- the legend at the left (the sheet's, not the window's) ----------------
const LX=6,LW=420;s+=R(LX,74,LW,H-26-74-6,'#202020',{r:6,s:'#3a3a3a'});
{let y=96;const tx=LX+40,tw=LW-54,Z=11,LH=13.5;
 s+=T(LX+16,y,'The track rows and the Mixer',{z:18,w:700});y+=19;
 const sub=para(LX+16,y,'','DF-W20. Real size, Compact density, the song "Norway". Top: the track headers with their mixer section. Bottom: Live 12\'s Mixer in the lower panel. Boxes with an orange dashed edge are the sheet\'s, not the window\'s. One number marks one part in both halves. The moment drawn: a second after Bass\'s Solo was pressed. Only Bass, the returns\' tails and Main still move; the other bars have dropped, and their held-peak lines still stand.',LW-32,10.5,13.5,{f:C.dim});s+=sub.g;y+=sub.h+8;
 const item=(n,title,body)=>{s+=num(LX+24,y-4,n);const b=para(tx,y,title,body,tw,Z,LH);s+=b.g;y+=b.h+4};
 item(1,'Track activator','The track\'s number; lit while the track is on, grey when off (Snare: silent, its clips grey).');
 item(2,'Solo','Blue while on: Bass.');
 item(3,'Arm','Red while on: Lead Vocals. A group and a return have none.');
 item(4,'Volume','A value box in dB, its blue fill the level; drag or type. In the Mixer also the fader on the meter\'s scale. New to the language: the fader, Live 12\'s triangle handle on a thin track.');
 item(5,'Pan','A ring knob drawn from the centre: "C", "8L" on Snare, "12R" on B Delay.');
 item(6,'Sends A and B','A ring knob per return. In the Mixer each reads its level under it, on the send taper measured in Live 12.4 (dashed box). A return\'s own sends start off, grey.');
 item(7,'Track Delay','-1,000 to +1,000 ms, in ms. Tracks, returns and Main have one (read on screen in Live 12). Bass plays 4 ms early.');
 item(8,'Meter','Two bars on one scale with the fader, -60 to +6 dB. The white line is the held peak the window takes from the engine once a frame, so a peak shorter than a frame still shows (DF-W32). The red mark on top: that bar passed 0 dB (Kick). The box over the meter keeps the highest peak in dB, red after a clip.');
 item(9,'In/Out','Audio From and its channel (MIDI: All Ins, All Channels), Monitor In / Auto / Off, Audio To. A group and a return show Audio To only; a track in a group plays to "Group".');
 item(10,'Height','The split line under a row: drag it to make the row taller or shorter.');
 item(11,'Rec-Q, Play-Q','ADI\'s own boxes under a MIDI track\'s name: the quantize for recording and for playing (DF-W7).');
 item(12,'Group','Drums: its fold switch, a filled circle, folds its tracks away (drawn open); no Arm. Its tracks carry a line in its colour, in both halves; in the Mixer a band over their strips too.');
 item(13,'Return','Its activator shows its letter (A, B) where a track\'s shows its number; Solo; Pre/Post for all sends to it. An empty circle in its title.');
 item(14,'Main','Last, no activator. Main Out 1/2, Cue Out 3/4, Solo / Cue, the Cue volume knob. In the Mixer its loudness: momentary, short-term, integrated LUFS and true peak.');
 item(15,'Title','The name in the track\'s colour. Selected (Lead Vocals): title bar lighter and outlined, strip lighter and outlined.');
 item(16,'Section switches','I·O, S (sends), R (returns), M (mixer), D (Track Delay): over the track names, and at the Mixer\'s right edge.');
 s+=L(LX+16,y-4,LX+LW-16,y-4,'#3a3a3a');y+=11;
 s+=T(LX+16,y,'Open, for the director',{z:12.5,w:700,f:C.acc});y+=16;
 const q=t=>{s+=CI(LX+24,y-4,2.5,C.acc);const b=para(LX+34,y,'',t,LW-50,Z,LH);s+=b.g;y+=b.h+2};
 q('The held peak line: fall back after a moment (drawn: holds 2 s, then falls), or hold until clicked, as the number box does?');
 q('The clip mark: cleared by a click on it, by Play, or both?');
 q('The fader: Live\'s triangle on a thin track, as drawn, or a cap the language does not have yet?');
 q('Widths: header 500 px with Track Delay shown, strip 76 px, Main 128 px. Wider with Open density, or by dragging?');
 q('Send readouts under every knob always, or only under the pointer? Track Delay in ms only, or with Live\'s switch to samples?');
 q('Rec-Q, Play-Q under the name, or in the I·O section (DF-W7)? Main\'s loudness on its row too?');
}

// ---------------- the Arrangement, top ----------------
const BOT=536,SB=H-26;
const ax=LX+LW+6,aw=W-ax-6,ay=74,HW=500,lw=aw-HW,hx=ax+lw;

s+=R(ax,ay,aw,BOT-ay-6,'#202020',{r:6});
// ruler: bar numbers, the song's locators, the loop brace over the chorus
const ry=ay;s+=R(ax,ry,lw,26,'#262626',{r:6});s+=R(ax,ry+8,lw,18,'#262626');
const LOC={5:'Verse',13:'Chorus',21:'Verse 2'};
for(let b=0;b*PXB<lw;b++){const x0=ax+b*PXB,bar=b*2+1;s+=L(x0,ry+14,x0,ry+26,'#5a5a5a');if(x0+22<ax+lw)s+=T(x0+4,ry+12,String(bar),{z:10.5,f:C.dim});for(let q=1;q<4;q++)s+=L(x0+q*PXB/4,ry+21,x0+q*PXB/4,ry+26,'#444');
  if(LOC[bar]){const tw=bar<10?12:19;s+=P(`M${x0+tw+2} ${ry+3}l7 4.5l-7 4.5z`,{f:C.dim});s+=T(x0+tw+12,ry+11.5,LOC[bar],{z:10,f:C.dim})}}
s+=R(bx(13),ry+16,8*BW,7,C.acc,{r:3,op:0.9});
// the buttons over the track names, as on the Arrangement sheet; D (Track Delay) is on here
function sectionBtns(x,y,vert){let g='';const L5=[['I·O',1],['S',1],['R',1],['M',1],['D',1]];
  if(!vert){g+=grp(x,y,122,20);L5.forEach(([t,on],k)=>{if(on)g+=R(x+2+k*24,y+2,22,16,C.acc,{r:4});g+=T(x+13+k*24,y+14,t,{z:9.5,a:'middle',w:700,f:on?C.ink:C.dim})})}
  else{g+=grp(x,y,26,112);L5.forEach(([t,on],k)=>{if(on)g+=R(x+2,y+2+k*21.6,22,19.6,C.acc,{r:4});g+=T(x+13,y+15.5+k*21.6,t,{z:9.5,a:'middle',w:700,f:on?C.ink:C.dim})})}return g}
let SWX;
{const by2=ry+3;s+=R(hx,ry,HW,26,'#262626');let x=hx+6;
 s+=btn(x,by2,26,20,'',{r:4});s+=iSwap(x+13,by2+10,C.text);x+=30;
 s+=btn(x,by2,112,20,'',{r:4});s+=T(x+7,by2+14,'Show',{z:10.5,f:C.dim});s+=T(x+40,by2+14,'All groups',{z:10.5,w:600});s+=P(`M${x+98} ${by2+8}l3.5 3.5l3.5 -3.5`,{s:C.dim,sw:1.5});x+=118;
 SWX=x;s+=sectionBtns(x,by2);x+=128;
 s+=grp(x,by2,50,20);s+=T(x+13,by2+14,'H',{z:10,a:'middle',w:700,f:C.dim});s+=sep(x+25,by2,20);s+=T(x+37,by2+14,'W',{z:10,a:'middle',w:700,f:C.dim});x+=56;
 s+=btn(x,by2,26,20,'',{r:4,on:1});s+=iArm(x+13,by2+10,C.ink).replace(/stroke-width="2.2"/,'stroke-width="1.8"');x+=30;
 s+=btn(x,by2,22,20,'',{r:4});s+=R(x+6,by2+9,10,7,'none',{r:1.5,s:C.dim,sw:1.4})+P(`M${x+8} ${by2+9}v-2a3 3 0 0 1 6 0v2`,{s:C.dim,sw:1.4});}

// the header's columns
const IX=hx+134,MXc=hx+246,KA=hx+350,KB=hx+374,DX=hx+394,MTX=hx+466;
// the meter, two bars: the clip mark over each, the level now, the held-peak line (the R bar a little under the L)
function meter2(x,y,h,bw,gap,tr){let g='';const clip=tr.pk!=null&&tr.pk>0;
  [0,bw+gap].forEach(k=>g+=R(x+k,y,bw,3,clip?C.rec:'#0d0d0f',{r:1}));
  const pk2=tr.pk==null?null:tr.pk-0.5,n2=tr.now==null?null:tr.now-0.6;
  g+=meterV(x,y+4,bw,h-4,lv(tr.now),lv(tr.pk))+meterV(x+bw+gap,y+4,bw,h-4,lv(n2),lv(pk2));return g}
function monitor(x,y,w){let g=grp(x,y,w,16);const a=w*0.19,b=w*0.62;g+=R(x+a+1,y+2,b-a-2,12,C.acc,{r:3});
  g+=T(x+a/2+1,y+12,'In',{z:9.5,a:'middle',f:C.dim,w:600});g+=T(x+(a+b)/2,y+12,'Auto',{z:9.5,a:'middle',f:C.ink,w:700});g+=T(x+(b+w)/2,y+12,'Off',{z:9.5,a:'middle',f:C.dim,w:600});return g}
const prePost=(x,y)=>btn(x,y,34,16,'Post',{r:4,z:9,f:C.dim});
// the title's switch: a track's unfold switch (a circled chevron, as on the Arrangement sheet); the group's fold
// switch, filled so it is told apart; a return's and Main's empty circle
function titleSw(x,y,tr){if(tr.k==='g')return CI(x,y,6.5,C.ink)+P(`M${x-3} ${y-1}l3 3l3 -3`,{s:tr.c,sw:1.7});
  if(tr.k==='r'||tr.k==='main')return CI(x,y,6,'none',{s:C.ink,sw:1.6});
  return CI(x,y,6,'none',{s:C.ink,sw:1.6})+P(`M${x-3} ${y-1}l3 3l3 -3`,{s:C.ink,sw:1.6})}
// the title block, lighter and outlined when selected
const titleSel=(x,y,w,h,r)=>R(x,y,w,h,'#ffffff',{r,op:0.24})+R(x+0.5,y+0.5,w-1,h-1,'none',{r,s:C.text});
function header(tr,y){const h=tr.h;let g='';const ln=tr.lines||[],ind=ln.length*5;
  g+=R(hx,y,HW,h,tr.sel?C.head:C.panel);g+=R(hx+ind,y,128-ind,h,tr.c);if(tr.sel)g+=titleSel(hx+ind,y,128-ind,h,0);
  ln.forEach((c,k)=>g+=R(hx+k*5,y-1,4,h+2,c)+R(hx+k*5+4,y,1,h,C.line));
  g+=titleSw(hx+ind+12,y+12,tr);g+=T(hx+ind+24,y+16,tr.n,{z:11.5,f:C.ink,w:700});
  if(tr.k==='m'){g+=T(hx+8,y+39,'Rec-Q',{z:9.5,f:C.ink,w:600});g+=box(hx+52,y+28,48,15,'1/16',{z:9});g+=T(hx+8,y+58,'Play-Q',{z:9.5,f:C.ink,w:600});g+=box(hx+52,y+47,48,15,'Off',{z:9,f:C.dim})}
  // In/Out
  tr.io.forEach((v,k)=>{const yy=y+4+k*18;if(yy+16>y+h-2)return;g+=v==='mon'?monitor(IX,yy,104):ch(IX,yy,104,16,v,9.5)});
  // the mixer section
  if(tr.k!=='main'){g+=btn(MXc,y+4,34,16,tr.num,{on:!tr.off,r:4,z:10,f:C.faint});
    g+=btn(MXc+38,y+4,20,16,'S',{on:tr.solo,c:C.val,r:4,z:10,f:C.dim});
    if(tr.k==='a'||tr.k==='m'){g+=btn(MXc+62,y+4,20,16,'',{r:4,on:tr.arm,c:C.rec});g+=CI(MXc+72,y+12,3.6,tr.arm?C.ink:C.dim)}
    if(tr.k==='r')g+=prePost(MXc+62,y+4);
    if(h>=44){g+=box(MXc,y+24,46,16,dbt(tr.vol),{fill:lv(tr.vol),z:9.5});g+=knob(MXc+68,y+32,7.5,tr.pan[0],C.val,'','',{bi:1,ring:2})}}
  else{g+=box(MXc,y+4,46,16,dbt(tr.vol),{fill:lv(tr.vol),z:9.5});g+=knob(MXc+68,y+12,7.5,tr.pan[0],C.val,'','',{bi:1,ring:2});
    g+=T(MXc+46,y+35.5,'Cue',{z:9,f:C.dim,a:'end',w:600});g+=knob(MXc+68,y+32,7.5,0.72,C.val,'','',{ring:2})}
  // sends: the A and B letters over a track's knobs; a return's own sends start off and carry none
  if(tr.sends&&h>=44)[[KA,'A'],[KB,'B']].forEach(([kx,l],k)=>{const dis=tr.sdis&&tr.sdis[k];if(tr.k!=='r')g+=T(kx,y+14,l,{z:9,f:C.dim,a:'middle'});g+=knob(kx,y+31,7.5,dis?0:tr.sends[k],C.val,'','',{ring:2,dis})});
  // Track Delay, in ms
  g+=box(DX,y+4,46,16,tr.dly,{z:9.5,f:tr.dly==='0.00'?C.dim:C.text});g+=T(DX+50,y+15.5,'ms',{z:9,f:C.dim});
  g+=meter2(MTX,y+3,h-6,5,2,tr);
  return g}

// the tracks
