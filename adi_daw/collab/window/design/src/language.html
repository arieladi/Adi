<script>
// ADI design language, proposal 1 (17 November 2026): the default dark theme, the Control Bar's
// buttons in grouped, rounded form, the ring knob, the boxes. ADI's own drawing; not a build.
const W=1920,H=1080;let s='';
const C={win:'#1b1b1b',bar:'#242424',panel:'#2b2b2b',lane:'#323232',lane2:'#2e2e2e',ctl:'#3d3d3d',edge:'#4a4a4a',line:'#111111',text:'#dcdcdc',dim:'#8f8f8f',faint:'#5c5c5c',
  acc:'#ffad3b',val:'#4fc3ea',rec:'#ff4a4a',grn:'#62d36b',yel:'#f2c53d'};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r||0}" fill="${f}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1}"`:''}${o.op!=null?` opacity="${o.op}"`:''}${o.d?` stroke-dasharray="${o.d}"`:''}/>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.z||12}" fill="${o.f||C.text}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.op!=null?` opacity="${o.op}"`:''}>${t}</text>`;
const L=(x1,y1,x2,y2,c,w=1,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"${o.op!=null?` opacity="${o.op}"`:''}${o.cap?` stroke-linecap="${o.cap}"`:''}/>`;
const P=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1}"`:''}${o.op!=null?` opacity="${o.op}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
const pol=(cx,cy,r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
function arc(cx,cy,r,a0,a1){const[p0x,p0y]=pol(cx,cy,r,a0),[p1x,p1y]=pol(cx,cy,r,a1);return`M${p0x.toFixed(2)} ${p0y.toFixed(2)}A${r} ${r} 0 ${Math.abs(a1-a0)>180?1:0} ${a1>a0?1:0} ${p1x.toFixed(2)} ${p1y.toFixed(2)}`}
function knob(cx,cy,r,v,col,label,val,o={}){let g='';const a0=-135,a1=135,av=a0+(a1-a0)*v,rw=o.ring||Math.max(2.2,r*0.17);
  g+=P(arc(cx,cy,r,a0,a1),{s:o.track||'#141414',sw:rw});
  if(o.bi)g+=P(arc(cx,cy,r,Math.min(0,av),Math.max(0,av)+0.01),{s:col,sw:rw});else g+=P(arc(cx,cy,r,a0,av+0.01),{s:col,sw:rw,op:o.dis?0.35:1});
  if(o.mod){const m0=a0+(a1-a0)*o.mod[0],m1=a0+(a1-a0)*o.mod[1];g+=P(arc(cx,cy,r+rw+1.5,m0,m1),{s:'#c479ff',sw:1.6})}
  g+=`<circle cx="${cx}" cy="${cy}" r="${r-rw-1.5}" fill="${o.hover?'url(#dialh)':'url(#dial)'}" stroke="#141414" stroke-width="1"/>`;
  const[px,py]=pol(cx,cy,r-rw-3,av),[qx,qy]=pol(cx,cy,(r-rw-3)*0.3,av);g+=L(qx,qy,px,py,o.dis?'#777':'#f0f0f0',Math.max(1.4,r*0.09),{cap:'round'});
  if(o.auto)g+=`<circle cx="${cx+r}" cy="${cy-r}" r="2.6" fill="${C.rec}"/>`;
  if(label)g+=T(cx,cy+r+14,label,{z:o.lz||10.5,f:C.dim,a:'middle'});
  if(val)g+=T(cx,cy+r+(label?28:15),val,{z:o.lz||10.5,f:o.dis?C.faint:C.text,a:'middle'});return g}
const btn=(x,y,w,h,t,o={})=>R(x,y,w,h,o.on?o.c||C.acc:o.fill||C.ctl,{r:o.r==null?5:o.r,s:o.on?null:o.s||C.edge})+(t?T(x+w/2,y+h/2+4,t,{z:o.z||11.5,a:'middle',f:o.on?'#1a1a1a':o.f||C.text,w:o.w||600}):'');
const head=(x,y,t,sub)=>T(x,y,t,{z:15,w:600})+(sub?T(x,y+18,sub,{z:11.5,f:C.dim}):'');
const cap=(x,y,t,a)=>T(x,y,t,{z:10.5,f:C.dim,a:a||'middle'});
// icons, drawn round and a little heavy
const iPlay=(x,y,c)=>P(`M${x-5} ${y-7}L${x+7} ${y}L${x-5} ${y+7}Z`,{f:c,s:c,sw:2.6});
const iStop=(x,y,c)=>R(x-6.5,y-6.5,13,13,c,{r:2.8});
const iRec=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`;
const iPlus=(x,y,c)=>P(`M${x-7} ${y}h14M${x} ${y-7}v14`,{s:c,sw:2.2});
const iArm=(x,y,c)=>P(`M${x-7} ${y+5}c5 0 3 -10 8 -10`,{s:c,sw:2.2})+`<circle cx="${x+5}" cy="${y-5}" r="2.6" fill="${c}"/>`;
const iBack=(x,y,c)=>P(`M${x+7} ${y}h-13M${x-6} ${y}l5 -5M${x-6} ${y}l5 5`,{s:c,sw:2.2});
const iLoop=(x,y,c)=>P(`M${x-8} ${y+5}v-6a4 4 0 0 1 4 -4h8a4 4 0 0 1 4 4v6`,{s:c,sw:2.2});
const iIn=(x,y,c)=>P(`M${x-7} ${y+5}h5c3 0 3 -10 6 -10h4`,{s:c,sw:2.2});
const iOut=(x,y,c)=>P(`M${x-7} ${y-5}h4c3 0 3 10 6 10h5`,{s:c,sw:2.2});
const iUndo=(x,y,c)=>P(`M${x-6} ${y-2}h8a4.5 4.5 0 0 1 0 9h-5M${x-6} ${y-2}l4 -4M${x-6} ${y-2}l4 4`,{s:c,sw:2.1});
const iRedo=(x,y,c)=>P(`M${x+6} ${y-2}h-8a4.5 4.5 0 0 0 0 9h5M${x+6} ${y-2}l-4 -4M${x+6} ${y-2}l-4 4`,{s:c,sw:2.1});
const iPen=(x,y,c)=>P(`M${x-6} ${y+6}l2 -5l8 -8l3 3l-8 8z`,{s:c,sw:1.9});
const iKeys=(x,y,c)=>R(x-8,y-6,16,12,'none',{r:2,s:c,sw:1.8})+L(x-3,y-6,x-3,y+1,c,1.8)+L(x+3,y-6,x+3,y+1,c,1.8);
const iMetro=(x,y,c)=>`<circle cx="${x-4}" cy="${y}" r="4" fill="none" stroke="${c}" stroke-width="1.9"/><circle cx="${x+6}" cy="${y}" r="3.2" fill="${c}"/>`;
const grp=(x,y,w,h)=>R(x,y,w,h,'#2f2f2f',{r:8,s:'#454545'});
const sep=(x,y,h)=>L(x,y+4,x,y+h-4,'#484848');

function eqd(x,y,w,h,bands,seed){let g='';const r=rng(seed);const mid=y+h*0.5;
  g+=`<clipPath id="c${seed}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/></clipPath><g clip-path="url(#c${seed})">`;g+=R(x,y,w,h,'#161616');
  for(let k=1;k<10;k++){const gx=x+w*Math.log10(1+k*1.9)/Math.log10(20);g+=L(gx,y,gx,y+h,'#ffffff',1,{op:0.04})}for(let k=1;k<4;k++)g+=L(x,y+h*k/4,x+w,y+h*k/4,'#ffffff',1,{op:0.05});
  let sp=`M${x} ${y+h}`,n=90,lv=0.5;for(let k=0;k<=n;k++){const u=k/n;lv=lv*0.72+0.28*r();const env=Math.sin(Math.PI*Math.pow(u,0.8))*(1-u*0.3);sp+=`L${(x+w*u).toFixed(1)} ${(y+h-h*0.62*env*(0.45+0.75*lv)).toFixed(1)}`}sp+=`L${x+w} ${y+h}Z`;g+=P(sp,{f:'#ffffff',op:0.10});g+=P(sp,{s:'#cfcfcf',sw:0.8,op:0.35});
  const one=(b,u)=>b.t==='hp'?-1.4*Math.max(0,(b.f-u)/0.12):b.t==='hs'?b.g/(1+Math.exp((b.f-u)/0.04)):b.g*Math.exp(-Math.pow((u-b.f)/(b.q||0.07),2));
  const resp=u=>bands.reduce((v,b)=>v+one(b,u),0);let d='';const m=140;
  for(const b of bands){if(b.t==='hp')continue;let bd=`M${x} ${mid}`;for(let k=0;k<=m;k++){const u=k/m;bd+=`L${(x+w*u).toFixed(1)} ${(mid-one(b,u)*h*0.36).toFixed(1)}`}g+=P(bd+`L${x+w} ${mid}Z`,{f:b.c,op:0.22})}
  for(let k=0;k<=m;k++){const u=k/m,yy=Math.max(y-4,Math.min(y+h+4,mid-resp(u)*h*0.36));d+=(k?'L':'M')+(x+w*u).toFixed(1)+' '+yy.toFixed(1)}
  g+=L(x,mid,x+w,mid,'#ffffff',1,{op:0.12});g+=P(d,{s:C.yel,sw:2});
  for(const b of bands){const yy=mid-resp(b.f)*h*0.36;g+=`<circle cx="${(x+w*b.f).toFixed(1)}" cy="${Math.max(y+7,Math.min(y+h-7,yy)).toFixed(1)}" r="5.5" fill="${b.c}" stroke="#161616" stroke-width="1.5"/>`}
  return g+'</g>'}
function dynd(x,y,w,h,seed,o={}){let g='';const r=rng(seed);
  g+=`<clipPath id="d${seed}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/></clipPath><g clip-path="url(#d${seed})">`;g+=R(x,y,w,h,'#161616');
  let lv=`M${x} ${y+h}`,gr=`M${x} ${y}`,n=Math.floor(w/2.6),a=0.5,q=0;
  for(let k=0;k<=n;k++){const u=k/n;a=a*0.6+0.4*r();const hit=(k%(o.per||10))<2?1:0;q=Math.max(q*0.8,hit*(0.5+0.5*r()));const e=0.35+0.4*a+0.22*q;
    lv+=`L${(x+w*u).toFixed(1)} ${(y+h-h*0.8*e).toFixed(1)}`;gr+=`L${(x+w*u).toFixed(1)} ${(y+h*0.4*q*(0.6+0.4*a)+1).toFixed(1)}`}
  g+=P(lv+`L${x+w} ${y+h}Z`,{f:'#9db3c9',op:0.22});g+=P(lv,{s:'#b9c7d6',sw:0.8,op:0.5});g+=P(gr+`L${x+w} ${y}Z`,{f:C.rec,op:0.28});g+=P(gr,{s:C.rec,sw:1.1});
  g+=L(x,y+h*0.34,x+w,y+h*0.34,C.acc,1,{op:0.7});return g+'</g>'}
function curved(x,y,w,h){let g=R(x,y,w,h,'#161616',{r:5});for(let k=1;k<4;k++){g+=L(x+w*k/4,y,x+w*k/4,y+h,'#ffffff',1,{op:0.05});g+=L(x,y+h*k/4,x+w,y+h*k/4,'#ffffff',1,{op:0.05})}
  g+=L(x,y+h,x+w,y,'#ffffff',1,{op:0.12});const tx=x+w*0.55,ty=y+h*0.45;g+=P(`M${x} ${y+h}L${tx-10} ${ty+10}Q${tx} ${ty} ${tx+12} ${ty-4}L${x+w} ${y+h*0.33}`,{s:C.val,sw:2});
  g+=`<circle cx="${tx}" cy="${ty+1}" r="4.5" fill="${C.acc}" stroke="#161616" stroke-width="1.5"/>`;return g}
function filterd(x,y,w,h){let g=`<clipPath id="fl${x}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/></clipPath><g clip-path="url(#fl${x})">`+R(x,y,w,h,'#161616');
  for(let k=1;k<10;k++){const gx=x+w*Math.log10(1+k*1.9)/Math.log10(20);g+=L(gx,y,gx,y+h,'#ffffff',1,{op:0.04})}
  const f=0.62,mid=y+h*0.52;let d='';for(let k=0;k<=120;k++){const u=k/120;const v=0.55*Math.exp(-Math.pow((u-f)/0.035,2))-(u>f?(u-f)*4.2:0);d+=(k?'L':'M')+(x+w*u).toFixed(1)+' '+(mid-v*h*0.5).toFixed(1)}
  g+=P(d+`L${x+w} ${y+h}L${x} ${y+h}Z`,{f:C.val,op:0.14});g+=P(d,{s:C.val,sw:2});g+=`<circle cx="${x+w*f}" cy="${mid-0.55*h*0.5}" r="5.5" fill="${C.val}" stroke="#161616" stroke-width="1.5"/>`;return g+'</g>'}
const pill=(x,y,w,h,t,o={})=>R(x,y,w,h,o.on?o.c||C.acc:'#383838',{r:h/2,s:o.on?null:'#4a4a4a'})+T(x+w/2,y+h/2+3.8,t,{z:o.z||10.5,a:'middle',f:o.on?'#1a1a1a':o.f||C.text,w:o.on?600:400});
function panel(x,y,w,h,name,sub){let g=R(x,y,w,h,C.panel,{r:6,s:'#404040'});g+=R(x,y,w,22,'#383838',{r:6});g+=R(x,y+12,w,10,'#383838');g+=`<circle cx="${x+13}" cy="${y+11}" r="5.5" fill="${C.acc}"/>`;g+=T(x+26,y+15.5,name,{z:12,w:600});if(sub)g+=T(x+w-10,y+15.5,sub,{z:10.5,f:C.dim,a:'end'});return g}
// A compressor panel that scales with the density.
function compPanel(x,y,w,h,k){let g=panel(x,y,w,h,'Compressor','Vocal');const gh=Math.round(h*0.36),cw=gh;g+=curved(x+8,y+30,cw,gh);g+=dynd(x+14+cw,y+30,w-cw-36,gh,91+w);
  g+=R(x+w-18,y+30,4,gh,'#141414',{r:2})+R(x+w-18,y+30+gh*0.3,4,gh*0.7,C.grn,{r:2})+R(x+w-11,y+30,4,gh,'#141414',{r:2})+R(x+w-11,y+30,4,gh*0.3,C.rec,{r:2});
  const ky=y+30+gh+ (k>1?34:24),cols=5,cwid=(w-16)/cols;[['Thresh','-18.0 dB',0.4,C.val],['Ratio','4 : 1',0.5,C.val],['Attack','12 ms',0.3,C.val],['Release','160 ms',0.55,C.val],['Makeup','+3.0',0.6,C.acc]].forEach(([l,v,pv,c],n)=>g+=knob(x+8+cwid*(n+0.5),ky,k>1?16:11,pv,c,l,v,{lz:k>1?11:9.5}));
  const py=y+h-(k>1?30:24);g+=pill(x+10,py,k>1?92:80,k>1?19:16,'Key: Internal');g+=pill(x+(k>1?110:96),py,k>1?52:44,k>1?19:16,'Listen');return g}

s+=`<defs>
<radialGradient id="dial" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#565656"/><stop offset="1" stop-color="#2a2a2a"/></radialGradient>
<radialGradient id="dialh" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#6c6c6c"/><stop offset="1" stop-color="#353535"/></radialGradient>
</defs>`;

s+=T(24,34,'ADI  ·  design language, proposal 2',{z:20,w:600});s+=T(24,54,'Default theme: Dark. Live stays the base for the Arrangement, the Browser and the Device View; the buttons, icons and knobs are redrawn. A picture to talk about, not a build.',{z:12.5,f:C.dim});s+=R(1660,14,236,34,C.acc,{r:6});s+=T(1778,37,'LANGUAGE SHEET',{z:16,w:700,a:'middle',f:'#1a1a1a'});

s+=head(24,92,'A   Control Bar','Top: as built today. Bottom: proposed. The same controls in the same order as Live; only how they are drawn changes.');
s+=`<image href="controlbar-as-built.png" x="24" y="120" width="1872" height="46.8" preserveAspectRatio="none"/>`;
const by=184,bh=44;s+=R(24,by,1872,bh,C.bar,{r:4});
let x=36;const cy=by+bh/2,t=by+8,h=28;
s+=grp(x,t,318,h);s+=T(x+26,cy+4,'Link',{z:11.5,a:'middle',f:C.dim,w:600});s+=sep(x+52,t,h);s+=T(x+74,cy+4,'Tap',{z:11.5,a:'middle',f:C.dim,w:600});s+=sep(x+96,t,h);
s+=T(x+130,cy+4,'120.00',{z:12,a:'middle',f:C.val,w:600});s+=sep(x+164,t,h);s+=T(x+192,cy+4,'4 / 4',{z:12,a:'middle',w:600});s+=sep(x+220,t,h);s+=iMetro(x+244,cy,C.dim);s+=sep(x+266,t,h);s+=T(x+292,cy+4,'1 Bar',{z:11.5,a:'middle',f:C.dim,w:600});
x=660;s+=grp(x,t,36,h);s+=iBack(x+18,cy,C.dim);s+=btn(x+42,t,84,h,'1.  1.  1',{fill:'#1a1a1a',s:'#3a3a3a',f:C.text,r:6});
x=796;s+=grp(x,t,150,h);s+=iPlay(x+25,cy,C.grn);s+=sep(x+50,t,h);s+=iStop(x+75,cy,C.text);s+=sep(x+100,t,h);s+=iRec(x+125,cy,C.rec);
x=956;s+=grp(x,t,200,h);s+=iPlus(x+25,cy,C.text);s+=sep(x+50,t,h);s+=R(x+52,t+2,46,h-4,C.acc,{r:6});s+=iArm(x+75,cy,'#1a1a1a');s+=sep(x+100,t,h);s+=iBack(x+125,cy,C.dim);s+=sep(x+150,t,h);s+=iRec(x+175,cy,'none')+`<circle cx="${x+175}" cy="${cy}" r="6.5" fill="none" stroke="${C.text}" stroke-width="2"/>`;
x=1170;s+=btn(x,t,84,h,'3.  1.  1',{fill:'#1a1a1a',s:'#3a3a3a',r:6});s+=grp(x+90,t,116,h);s+=iIn(x+110,cy,C.dim);s+=sep(x+129,t,h);s+=R(x+131,t+2,36,h-4,C.acc,{r:6});s+=iLoop(x+149,cy,'#1a1a1a');s+=sep(x+168,t,h);s+=iOut(x+188,cy,C.dim);s+=btn(x+212,t,84,h,'4.  0.  0',{fill:'#1a1a1a',s:'#3a3a3a',r:6});
x=1560;s+=grp(x,t,76,h);s+=iUndo(x+20,cy,C.text);s+=sep(x+38,t,h);s+=iRedo(x+57,cy,C.dim);
x=1648;s+=grp(x,t,116,h);s+=iPen(x+20,cy,C.dim);s+=sep(x+38,t,h);s+=iKeys(x+58,cy,C.dim);s+=sep(x+78,t,h);s+=T(x+97,cy+4,'Key',{z:11.5,a:'middle',f:C.dim,w:600});
s+=grp(1776,t,108,h);s+=T(1802,cy+4,'MIDI',{z:11.5,a:'middle',f:C.dim,w:600});s+=sep(1830,t,h);s+=T(1857,cy+4,'6 %',{z:11.5,a:'middle',f:C.dim,w:600});

// ---------- B: buttons ----------
const By=262;s+=head(24,By,'B   Buttons','Related buttons share one rounded group. States left to right.');
{let bx=24;const yy=By+34;[['Rest',{}],['Pointer over',{fill:'#4a4a4a',s:'#5c5c5c'}],['Pressed',{fill:'#262626',s:'#3a3a3a'}],['On',{on:1}],['On, record',{on:1,c:C.rec}],['On, value',{on:1,c:C.val}],['Disabled',{f:C.faint,fill:'#2c2c2c',s:'#363636'}]].forEach(([n,o])=>{s+=btn(bx,yy,74,28,'Solo',o);s+=cap(bx+37,yy+46,n);bx+=86});

 s+=grp(368,gy,150,30);s+=R(370,gy+2,46,26,C.grn,{r:6});s+=iPlay(393,gy+15,'#1a1a1a');s+=sep(418,gy,30);s+=iStop(443,gy+15,C.text);s+=sep(468,gy,30);s+=R(470,gy+2,46,26,C.rec,{r:6});s+=iRec(493,gy+15,'#1a1a1a');s+=cap(443,gy+48,'Recording');
 // track switches
 s+=btn(540,gy+3,34,24,'1',{on:1,r:5});s+=btn(578,gy+3,26,24,'S',{r:5,f:C.dim});s+=btn(608,gy+3,26,24,'');s+=`<circle cx="621" cy="${gy+15}" r="5" fill="${C.dim}"/>`;s+=cap(587,gy+48,'Track: on, Solo, Arm');}

// ---------- C: the ring knob ----------
const Kx=660;s+=head(Kx,By,'C   Ring knob','The value is the ring. The same knob everywhere, in three sizes.');
