# SPDX-License-Identifier: GPL-3.0-or-later
#
# adi_daw CI — proving the format spec on more than one compiler.
#
# The point of this workflow is narrower and more specific than "the build is
# green". docs/format/SPEC.md §6.3 publishes exact byte sizes and field offsets
# for four binary record layouts, and claims a third party can reimplement a
# reader from the document alone. src/adi/blob.hpp turns every one of those
# claims into a static_assert — so any toolchain that COMPILES this tree has
# proved the claims for its own ABI, whether or not it can then run a test.
#
# That is why the matrix is shaped by ABI rather than by convenience:
#
#   clang / arm64  / libc++      macos-latest
#   clang / x86_64 / libc++      macos-latest, second slice of the same build
#   clang / x86_64 / libstdc++   ubuntu-latest
#   gcc   / x86_64 / libstdc++   ubuntu-latest
#   gcc   / arm64  / libstdc++   ubuntu-24.04-arm
#   gcc   / i386   / libstdc++   ubuntu-latest — ILP32: 32-bit size_t
#   MSVC  / x86_64 / MS STL      windows-latest — LLP64: 32-bit long
#   gcc   / s390x  / big-endian  ubuntu-latest — required to FAIL to compile
#
# The last leg is not a mistake. blob.hpp opens with
#   static_assert(std::endian::native == std::endian::little, ...)
# and that assert is only worth having if we know it fires. That job proves it
# does, by requiring the compile to fail with that exact diagnostic.
#
# A green tick here means: seven ABIs agree with SPEC §6.3, the sizes written in
# the spec's prose match the sizes the compilers actually produced, the
# little-endian precondition is enforced rather than merely asserted, and both
# Python validators pass on the oldest and the newest Python we support.

name: adi_daw

on:
  push:
    branches: [main, master]
    paths:
      - 'adi_daw/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/check_spec_layout.py'
  pull_request:
    paths:
      - 'adi_daw/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/check_spec_layout.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adi_daw-${{ github.ref }}
  cancel-in-progress: true

# bash on every runner, windows-latest included, so a `run:` block means the same
# thing everywhere. Without this, windows-latest runs pwsh, where the `set -euo
# pipefail` idiom below is a syntax error rather than a safety net.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # The two Python validators. They are pure-stdlib and resolve their inputs
  # relative to __file__, so CWD does not matter — but the Python version and the
  # host's SQLite do. 3.9 is the floor this was developed against; 3.13 is what a
  # fresh runner gives you. Windows is in the matrix because the documents these
  # parse are full of en-dashes and arrows: a bare open() there would decode them
  # as cp1252. Both validators pass encoding="utf-8" explicitly, and this proves
  # that keeps working.
  # ---------------------------------------------------------------------------
  validators:
    name: validators (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: macos-latest, python: '3.13' }
          - { os: windows-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Environment
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite3 library', sqlite3.sqlite_version)"

      # Invoked exactly as collab/README.md documents, from the repository root,
      # so that CI is testing the command a human is told to run.
      - name: validate_schema.py
        run: python adi_daw/tools/validate_schema.py

      - name: validate_ops.py
        run: python adi_daw/tools/validate_ops.py

  # ---------------------------------------------------------------------------
  # The real build: configure, compile, run adi_tests, then check the sizes this
  # compiler produced against the sizes SPEC.md publishes.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both slices are compiled, so blob.hpp's static_asserts are evaluated
          # for arm64 and for the x86_64 ABI in one job. Only the native slice
          # can be executed on an arm64 runner; the Linux legs cover x86_64 at
          # runtime.
          - name: 'macos arm64+x86_64 · apple clang · libc++'
            os: macos-latest
            osx_archs: 'arm64;x86_64'
          - name: 'ubuntu x86_64 · gcc · libstdc++'
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: 'ubuntu x86_64 · clang · libstdc++'
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: 'ubuntu arm64 · gcc · libstdc++'
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - name: 'windows x86_64 · msvc · ms stl'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          cmake --version | head -1
          python3 -VV
          uname -a || true

      # --build-only fetches the two entries the CMake tree links and skips
      # reference/, which is 630MB of GPL and AGPL source we read for design and
      # never compile. Calling the project's own script rather than cloning by
      # hand matters: the script verifies each clone against the commit pinned
      # beside it (ADR-0024), so a moved upstream tag fails here, before
      # anything is compiled, instead of quietly changing what we built against.
      - name: Fetch build dependencies, at their pinned commits
        run: bash adi_daw/tools/fetch_external.sh --build-only

      # CC/CXX and the macOS architecture list arrive through the environment
      # rather than interpolated into the command line: 'arm64;x86_64' contains a
      # semicolon, which a shell would read as a command separator. And a matrix
      # key that is absent expands to an empty string, so CC= would be exported
      # empty on the macOS and Windows legs and confuse CMake's compiler
      # detection — hence the unset.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          OSX_ARCHS: ${{ matrix.osx_archs }}
        run: |
          set -euo pipefail
          [ -n "${CC:-}" ]  || unset CC
          [ -n "${CXX:-}" ] || unset CXX
          if [ -n "${OSX_ARCHS:-}" ]; then
            cmake -S adi_daw -B adi_daw/build -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCHS"
          else
            cmake -S adi_daw -B adi_daw/build -DCMAKE_BUILD_TYPE=Debug
          fi

      # --config is required by the multi-config Visual Studio generator on
      # windows-latest and ignored by single-config generators, so one line
      # serves every leg.
      - name: Build
        run: cmake --build adi_daw/build --config Debug --parallel

      - name: adi_tests
        run: ctest --test-dir adi_daw/build --build-config Debug --output-on-failure

      # The Visual Studio generator puts binaries in build/Debug/, everything
      # else puts them in build/. Resolve it once, loudly, rather than letting a
      # later step skip silently because its `if [ -x ... ]` was false.
      - name: Locate adi_tool
        run: |
          set -euo pipefail
          for cand in adi_daw/build/adi_tool \
                      adi_daw/build/adi_tool.exe \
                      adi_daw/build/Debug/adi_tool.exe \
                      adi_daw/build/Debug/adi_tool; do
            if [ -f "$cand" ]; then
              echo "ADI_TOOL=$cand" >> "$GITHUB_ENV"
              echo "found $cand"
              exit 0
            fi
          done
          echo "::error::adi_tool was built but cannot be found. Tree follows."
          ls -R adi_daw/build
          exit 1

      - name: Record the layouts this ABI compiled
        run: |
          set -euo pipefail
          "$ADI_TOOL" layout
          "$ADI_TOOL" versions

      # adi_tests proves the layouts are self-consistent, and blob.hpp's
      # static_asserts prove they equal numbers written in a header. Neither
      # proves those numbers are the ones SPEC.md publishes — and SPEC.md is what
      # a third-party implementer reads. This step is the only thing in the tree
      # that compares the document against the binary.
      - name: SPEC 6.3 sizes match this build
        run: |
          set -euo pipefail
          python3 .github/scripts/check_spec_layout.py "$ADI_TOOL"

  # ---------------------------------------------------------------------------
  # ABIs the main matrix cannot reach. Neither job needs SQLite or CMake: the
  # four record layouts live in one header and one .cpp, and the test file
  # includes nothing else — so a direct compiler invocation is both sufficient
  # and far less likely to break for reasons that have nothing to do with the
  # format.
  # ---------------------------------------------------------------------------
  abi-ilp32:
    name: 'ubuntu i386 · gcc · ILP32 (32-bit size_t)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the 32-bit toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib g++-multilib

      # Every other leg has a 64-bit size_t, which hides a whole class of
      # length-arithmetic bug: in the stream header `count` is u32 and `rec_size`
      # is u16, so their product needs 48 bits and cannot be held by a 32-bit
      # size_t. This leg exists so that arithmetic is exercised by a real
      # compiler on a real ILP32 target instead of reasoned about.
      #
      # The warning set is the project's own, plus -Werror. That is safe to
      # demand here: the same set at -Werror was run over all three of our
      # translation units by Apple clang 17 and by GNU 16.2 before this file was
      # written, and both were silent. An ILP32 target narrows size_t, so if
      # -Wconversion has anything to say about this code it will say it here
      # first -- which is exactly the diagnostic we want to be fatal.
      - name: Compile and run under ILP32
        run: |
          set -euo pipefail
          g++ -m32 --version | head -1
          g++ -m32 -std=c++20 -Wall -Wextra -Wpedantic -Wcast-align \
              -Wconversion -Wsign-conversion -Wno-unused-parameter -Werror \
              -Iadi_daw/src \
              adi_daw/tests/test_main.cpp adi_daw/src/adi/blob.cpp \
              -o adi_tests32
          file adi_tests32
          ./adi_tests32

  abi-big-endian:
    name: 'big-endian guard actually fires (s390x)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install an s390x cross compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-s390x-linux-gnu

      # blob.hpp's first static_assert is
      #   std::endian::native == std::endian::little
      # with the comment "big-endian hosts need byte-swapping accessors". An
      # assertion nobody has ever watched fire is a comment, not a guarantee.
      # This step requires the compile to fail, and to fail for that reason — so
      # if the assert is later deleted to quiet something, CI goes red here
      # rather than silently accepting a reader that would mis-decode every
      # field of every record on a big-endian host.
      - name: The endianness static_assert must fire on big-endian
        run: |
          set -euo pipefail
          s390x-linux-gnu-g++ --version | head -1
          log=$(mktemp)
          if s390x-linux-gnu-g++ -std=c++20 -fsyntax-only \
               -Iadi_daw/src adi_daw/src/adi/blob.cpp >"$log" 2>&1; then
            echo "::error file=adi_daw/src/adi/blob.hpp::blob.hpp compiled clean" \
                 "for big-endian s390x. The std::endian::native static_assert that" \
                 "is supposed to prevent that is missing or has been weakened." \
                 "SPEC 6.3 says all integers are little-endian; a reader that" \
                 "ignores it mis-decodes every field."
            exit 1
          fi
          if ! grep -q 'byte-swapping accessors' "$log"; then
            echo "::error file=adi_daw/src/adi/blob.hpp::the s390x compile failed," \
                 "but not on the endianness assert, so this job is no longer" \
                 "testing what it claims to. Actual output follows."
            cat "$log"
            exit 1
          fi
          echo "ok    the big-endian guard fired, with its documented message:"
          grep -m1 -B1 -A1 'byte-swapping accessors' "$log"

  # ---------------------------------------------------------------------------
  # The flag wall in CMakeLists.txt is advisory: it sets -Wall -Wextra and the
  # rest, but neither branch sets -Werror or /WX, so a build stays green with any
  # number of new warnings in src/. Making it fatal there is a policy change to a
  # file another agent owns, and /WX in particular would break a build I cannot
  # test. This job applies the gate from outside instead — the project's own flag
  # set, plus -Werror, over the three translation units we actually wrote.
  #
  # Also the only place a hardened standard library runs. -D_GLIBCXX_ASSERTIONS
  # turns libstdc++'s precondition checks on, which is what would catch a
  # std::span or std::vector misuse at runtime; every other leg runs the
  # unhardened library and would sail past one.
  #
  # All three legs were run locally before this file was written -- Apple clang
  # 17.0.0 and GNU 16.2.0, -Werror, both hardening modes -- and all were silent.
  # ---------------------------------------------------------------------------
  strict:
    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'zero warnings + hardened libstdc++ (gcc)'
            os: ubuntu-latest
            cxx: g++
            harden: '-D_GLIBCXX_ASSERTIONS'
          - name: 'zero warnings + hardened libstdc++ (clang)'
            os: ubuntu-latest
            cxx: clang++
            harden: '-D_GLIBCXX_ASSERTIONS'
          - name: 'zero warnings + hardened libc++ (apple clang)'
            os: macos-latest
            cxx: clang++
            harden: '-D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG'
    steps:
      - uses: actions/checkout@v4

      # main.cpp is the only one of the three that includes anything external,
      # and only for its two version strings. Fetching for a header path is
      # cheaper than leaving one of our files outside the gate.
      - name: Fetch build dependencies, at their pinned commits
        run: bash adi_daw/tools/fetch_external.sh --build-only

      # Through CMake, not a hand-rolled compile.
      #
      # This job used to compile the translation units directly with its own
      # flags, and discovered the file list with find so a new source could not
      # slip outside the gate. The discovery was the right instinct, but the
      # hand-rolled compile could not survive the tree growing: store.cpp needs
      # a header GENERATED by CMake (schema_sql.hpp, built from schema.sql so
      # the DDL cannot drift from the binary) and links against SQLiteCpp. A
      # find(1) list cannot express either, and the job failed the moment the
      # store layer landed.
      #
      # CMake already knows the full graph -- every target, every generated
      # input, every link edge -- so it discovers strictly more than find did,
      # and it also LINKS and RUNS the tests rather than only compiling them.
      #
      # -Werror arrives via -DADI_WERROR=ON, which puts it on the adi_warnings
      # interface target. Deliberately not CMAKE_CXX_FLAGS: that would apply it
      # to third_party/ too, and sqlite3.c is a 250k-line amalgamation that has
      # never promised to be warning-free under our flag set. Our code is what
      # this gates.
      - name: No warnings in our own code, and a hardened library under it
        env:
          CXX: ${{ matrix.cxx }}
          HARDEN: ${{ matrix.harden }}
        run: |
          set -euo pipefail
          "$CXX" --version | head -1

          cmake -S adi_daw -B build-strict \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER="$CXX" \
                -DCMAKE_CXX_FLAGS="$HARDEN" \
                -DADI_WERROR=ON
          cmake --build build-strict --parallel

          # Every registered test, run -- not merely compiled.
          ctest --test-dir build-strict --output-on-failure

          # The gate is only as good as its coverage, so say what it covered.
          # A target count that quietly drops is the failure mode this job has
          # already had once.
          n=$(ctest --test-dir build-strict -N | grep -c "^  Test +#" || true)
          echo "ok    every target built warning-free at -Werror; $n test binaries run"

          # Fuzz harnesses are NOT in that build: ADI_BUILD_FUZZERS is off by
          # default and clang-gated, so they are compiled by exactly one job, on
          # one compiler, against one standard library. That is how a
          # `std::memcpy` with no <cstring> reached CI -- fine on libc++, a hard
          # error on libstdc++, and invisible to every leg but the fuzz one.
          #
          # They define LLVMFuzzerTestOneInput rather than main, so they cannot
          # be linked here. They can be compiled, and that is the half that
          # catches this.
          W="-std=c++20 -Wall -Wextra -Wpedantic -Wcast-align -Wconversion"
          W="$W -Wsign-conversion -Wno-unused-parameter -Werror -Iadi_daw/src"
          harnesses=0
          for f in adi_daw/tests/fuzz_*.cpp; do
            [ -e "$f" ] || continue
            harnesses=$((harnesses + 1))
            echo "--- $(basename "$f") (syntax only)"
            "$CXX" $W "$HARDEN" -fsyntax-only "$f"
          done
          echo "ok    $harnesses fuzz harness(es) compile on this standard library"

  # ---------------------------------------------------------------------------
  # What did we actually build against?
  #
  # Every ABI result recorded in ADR-0022 was produced against whatever
  # third_party/ happened to be that day, because the fetch script cloned
  # default branches -- and nlohmann/json's default branch is `develop`. A green
  # tick was therefore not reproducible, and a red one next week might have been
  # nothing we did. ADR-0024 pins both, by tag AND by the commit that tag pointed
  # at, and fetch_external.sh refuses to proceed when the two disagree.
  #
  # This job is where that becomes visible rather than merely true: it prints the
  # provenance of the build, in one place, on every run. The fetch script is what
  # enforces the pin; this is what lets a human read it six months from now.
  # ---------------------------------------------------------------------------
  provenance:
    name: 'dependency provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch at the pinned commits
        run: bash adi_daw/tools/fetch_external.sh --build-only

      - name: Print what this build links, and re-check it against the pins
        run: |
          set -euo pipefail
          script=adi_daw/tools/fetch_external.sh
          fail=0
          printf '%-14s %-9s %-42s %-12s %s\n' DIR TAG PINNED FETCHED DATE
          for dir in SQLiteCpp json; do
            # The pinned tag and commit, read back out of the script's own table
            # rather than repeated here. A second copy of these hashes in this
            # file would be one more thing that can drift.
            row=$(grep -E "^  \"[^\"]*  *${dir}  " "$script" | head -1)
            if [ -z "$row" ]; then
              echo "::error file=${script}::no THIRD_PARTY row found for ${dir}"
              fail=1; continue
            fi
            tag=$(echo "$row" | awk '{print $4}')
            want=$(echo "$row" | awk '{print $5}')
            got=$(git -C "adi_daw/third_party/$dir" rev-parse HEAD)
            date=$(git -C "adi_daw/third_party/$dir" log -1 --format=%cs)
            printf '%-14s %-9s %-42s %-12s %s\n' "$dir" "$tag" "$want" "${got:0:12}" "$date"
            if [ "$got" != "$want" ]; then
              echo "::error file=${script}::${dir} is at ${got}, pinned at ${want}"
              fail=1
            fi
          done

          # The sqlite3 that ends up inside our binary is the amalgamation
          # vendored in SQLiteCpp, not the host's. Pinning SQLiteCpp to its 3.3.3
          # tag moved this from 3.53.4 to 3.49.2, because its master branch was
          # ahead of its own release. That is the pin working as intended, and it
          # is the kind of thing that should be legible in a build log.
          ver=$(grep -m1 '#define SQLITE_VERSION  *"' \
                adi_daw/third_party/SQLiteCpp/sqlite3/sqlite3.c | sed 's/.*"\(.*\)".*/\1/')
          echo
          echo "vendored sqlite3 amalgamation: ${ver}"
          [ -n "$ver" ] || { echo "::error::could not read SQLITE_VERSION"; fail=1; }

          exit "$fail"

  # ---------------------------------------------------------------------------
  # Fuzz StreamReader.
  #
  # It is the only component in the tree that parses bytes it did not write, and
  # four defects were found in it by hand in the first audit (ADR-0023): an
  # unchecked index that segfaulted, a 32-bit length overflow, an uncapped
  # allocation, and a rec_size that tore a field in half. Hand-auditing found
  # those four; this is what looks for the fifth.
  #
  # The property is "no input causes a crash, a hang, or a read outside the
  # buffer" -- NOT "parses correctly". Almost every random input is invalid and
  # must be rejected; rejection is a pass. Only a sanitiser report, a timeout, or
  # one of the harness's self-consistency invariants is a finding.
  #
  # Two steps, deliberately: replaying the seed corpus is a fast deterministic
  # regression test over shapes that have already broken this reader, and would
  # catch a reintroduction on the first second of the run. The timed campaign
  # after it is the part that looks for something new.
  # ---------------------------------------------------------------------------
      # VST3 hosting (ADR-0057). Most of what this asserts needs NO PLUGIN
      # INSTALLED, which is the point: a CI runner has none, and a check that
      # needs one is a check that does not run. It proves the format manager
      # carries VST3 and nothing else at RUN time, and that a plugin which
      # cannot be instantiated becomes a bypassed placeholder carrying its
      # identity rather than a null (ADR-0011). If the runner does happen to
      # have a VST3, it scans and round-trips its state as well.
      - name: ADR-0057 — VST3 hosting behind the device contract
        run: |
          set -euo pipefail
          found=""
          while IFS= read -r cand; do
            case "$cand" in *adi_vst3_probe|*adi_vst3_probe.exe) found="$cand"; break ;; esac
          done < <(find adi_daw/build-juce -type f -name 'adi_vst3_probe*' 2>/dev/null)
          if [ -z "$found" ]; then
            echo "::error::adi_vst3_probe was built but cannot be found"
            exit 1
          fi
          "$found"

  fuzz:
    name: 'fuzz StreamReader (clang · ASan + UBSan)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and its sanitiser runtimes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-rt-dev \
            || sudo apt-get install -y -qq clang

      # -fsanitize=fuzzer fails at LINK time when the runtime archive is absent,
      # which on Apple's toolchain is a confusing error an hour into a build.
      # Find out here, in three seconds, with a sentence that says what is wrong.
      - name: Preflight — is a libFuzzer runtime actually present?
        run: |
          set -euo pipefail
          clang++ --version | head -1
          cat > /tmp/preflight.cpp <<'EOF'
          #include <cstddef>
          #include <cstdint>
          extern "C" int LLVMFuzzerTestOneInput(const uint8_t*, size_t) { return 0; }
          EOF
          if ! clang++ -std=c++20 -fsanitize=fuzzer,address,undefined \
                 /tmp/preflight.cpp -o /tmp/preflight 2>/tmp/preflight.log; then
            echo "::error::this clang has no libFuzzer runtime; install the" \
                 "libclang-rt-*-dev matching $(clang++ --version | head -1)"
            cat /tmp/preflight.log
            exit 1
          fi
          echo "ok    libFuzzer, ASan and UBSan all link"

      - name: Fetch build dependencies, at their pinned commits
        run: bash adi_daw/tools/fetch_external.sh --build-only

      - name: Configure and build the fuzz target
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S adi_daw -B adi_daw/build-fuzz \
                -DCMAKE_BUILD_TYPE=Debug -DADI_BUILD_FUZZERS=ON
          cmake --build adi_daw/build-fuzz --target adi_fuzzers --parallel

      # Deterministic. Every seed is a shape that has already mattered: the four
      # findings from the first audit, the boundaries of the rules ADR-0023
      # introduced, and a valid blob of each record type.
      # libFuzzer refuses to start when -artifact_prefix names a directory that
      # does not exist, so this is created before the first run rather than
      # before the second. It is where a reproducer lands, and a reproducer is
      # only useful if the run that found it got as far as writing one.
      # Every binary the build produced, not a list written here. The -Werror
      # gate was a hardcoded list once, and the first file added to the tree
      # landed outside it; a fuzz job is worth even less when it silently
      # stops covering half of what exists.
      - name: Replay the seed corpora
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzz-artifacts
          found=0
          for f in adi_daw/build-fuzz/adi_fuzz_*; do
            [ -x "$f" ] || continue
            found=$((found + 1))
            stem=$(basename "$f")
            corpus="adi_daw/build-fuzz/fuzz_corpus/${stem#adi_fuzz_}"
            mkdir -p "$corpus"
            echo "--- $stem  ($(ls "$corpus" | wc -l) seeds)"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
              "$f" "$corpus" -runs=0 -artifact_prefix=/tmp/fuzz-artifacts/
          done
          [ "$found" -gt 0 ] || { echo "::error::no fuzz binaries were built"; exit 1; }
          echo "ok    replayed $found fuzz target(s)"

      - name: Fuzz
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzz-artifacts
          for f in adi_daw/build-fuzz/adi_fuzz_*; do
            [ -x "$f" ] || continue
            stem=$(basename "$f")
            corpus="adi_daw/build-fuzz/fuzz_corpus/${stem#adi_fuzz_}"
            mkdir -p "$corpus"
            echo "=== $stem"
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 \
              "$f" "$corpus" -max_total_time=120 -rss_limit_mb=2048 \
                -print_final_stats=1 -artifact_prefix=/tmp/fuzz-artifacts/
          done

      # A crash is worth more than the log line announcing it: the artifact IS
      # the reproducer, and it goes straight into the seed corpus once fixed.
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducer
          path: /tmp/fuzz-artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JUCE-ON. One job, deliberately, and NOT required.
  #
  # ADR-0036 built the engine headless so the snapshot handoff could be proved
  # without a device, and ADR-0048 keeps ADI_WITH_JUCE OFF by default so the
  # whole tree still builds with no JUCE present. Every other job in this file
  # is a JUCE-OFF job and stays that way: those are what guard the property.
  #
  # This one exists to catch the dependency rotting -- a JUCE release that stops
  # configuring, a platform that stops linking, a host-format default that
  # flips. It is slow (JUCE compiles ~40 translation units before any of ours)
  # and it needs a 117MB clone, which is why it is one job on two platforms
  # rather than a leg on every ABI.
  #
  # LINUX IS ABSENT ON PURPOSE. A JUCE Linux build needs X11, ALSA, freetype,
  # webkit2gtk and more from apt, none of which step 6 targets. Adding it would
  # buy a third platform for the framework and nothing for the DAW. Say so here
  # rather than leaving a reader to wonder whether it was forgotten.
  # ---------------------------------------------------------------------------
  juce:
    name: 'JUCE on · ${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'macos arm64 · apple clang', os: macos-latest }
          - { name: 'windows x86_64 · msvc', os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE at its pinned commit
        run: bash adi_daw/tools/fetch_external.sh --with-juce

      - name: Configure and build the probe
        run: |
          set -euo pipefail
          cmake -S adi_daw -B adi_daw/build-juce \
                -DCMAKE_BUILD_TYPE=Debug -DADI_WITH_JUCE=ON
          cmake --build adi_daw/build-juce --config Debug \
                --target adi_audio_probe --parallel
          cmake --build adi_daw/build-juce --config Debug \
                --target adi_vst3_probe --parallel

      - name: Locate the probe
        run: |
          set -euo pipefail
          found=""
          while IFS= read -r cand; do
            case "$cand" in *adi_audio_probe|*adi_audio_probe.exe) found="$cand"; break ;; esac
          done < <(find adi_daw/build-juce -type f -name 'adi_audio_probe*' 2>/dev/null)
          if [ -z "$found" ]; then
            echo "::error::adi_audio_probe was built but cannot be found"
            find adi_daw/build-juce -name 'adi_audio_probe*' -o -name '*artefacts*' | head -20
            exit 1
          fi
          echo "ADI_PROBE=$found" >> "$GITHUB_ENV"
          echo "found $found"

      # ADR-0041: VST3 is the only host format, and every other one is 0
      # EXPLICITLY. This is the check that makes that a rule rather than a
      # sentence -- a future JUCE flipping a default would otherwise re-enable
      # an AU host with nobody noticing.
      - name: ADR-0041 — VST3 is the only host format
        run: |
          set -euo pipefail
          hosts=$("$ADI_PROBE" --hosts)
          echo "$hosts"
          fail=0
          expect() {
            if ! printf '%s\n' "$hosts" | grep -qx "$1=$2"; then
              echo "::error::ADR-0041 violated: expected $1=$2"
              fail=1
            fi
          }
          expect JUCE_PLUGINHOST_VST3   1
          expect JUCE_PLUGINHOST_VST    0
          expect JUCE_PLUGINHOST_AU     0
          expect JUCE_PLUGINHOST_LV2    0
          expect JUCE_PLUGINHOST_LADSPA 0
          exit "$fail"

      # ADR-0042 is a large-block decision, and the probe is how we find out
      # what a real driver will actually grant. A CI runner has no sound card,
      # so "no device" is a pass: it still proved JUCE configured, linked, and
      # ran far enough to ask the system for one.
      - name: Open a device at 256, 2048 and 8192
        run: "$ADI_PROBE"
