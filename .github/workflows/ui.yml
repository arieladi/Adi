# SPDX-License-Identifier: GPL-3.0-or-later
name: Recording seek Linux sanitizer check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0:alloc_dealloc_mismatch=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45f0a9b0deafbfa5b444b02929e1a231586a65b8
          persist-credentials: false
      - name: Reconstruct and verify the candidate tree
        shell: bash
        run: |
          sed 's/^|//; s/|$//' > "$RUNNER_TEMP/recording-seek.patch" <<'PATCH'
          |diff --git a/adi_daw/src/adi/ui/project_document.cpp b/adi_daw/src/adi/ui/project_document.cpp|
          |index b112f255..0341cd18 100644|
          |--- a/adi_daw/src/adi/ui/project_document.cpp|
          |+++ b/adi_daw/src/adi/ui/project_document.cpp|
          |@@ -181,7 +181,7 @@ long double trackRenderLength(Store &store, const engine::TrackNode &track, doub|
          |         const auto position = ends.getColumn(absolute ? 3 : 1).getInt64();|
          |         const auto length = ends.getColumn(absolute ? 4 : 2).getInt64();|
          |         const auto last = edit::addTime(position, length);|
          |-        const long double seconds = absolute ? last / 1000000000.0L : time.seconds(last);|
          |+        const long double seconds = absolute ? static_cast<long double>(last) / 1000000000.0L : time.seconds(last);|
          |         end = std::max(end, seconds);|
          |     }|
          |     return end > 0 ? end + tailSeconds : 0;|
          |diff --git a/adi_daw/tests/mix_seek_fixture.hpp b/adi_daw/tests/mix_seek_fixture.hpp|
          |index e88df1ab..a04f21c7 100644|
          |--- a/adi_daw/tests/mix_seek_fixture.hpp|
          |+++ b/adi_daw/tests/mix_seek_fixture.hpp|
          |@@ -215,9 +215,11 @@ inline void run(ui::AppCommands &commands,const std::filesystem::path &directory|
          |     if(!analysis){broker->shutdown();engineLease.reset();document->release();return;}|
          | |
          |     {|
          |-        ui::AdiRootComponent root(document->view(),document->ops(),document->mailbox(),commands,|
          |-                                  document->views(),document->sessionState(),name);|
          |-        root.sharedAnalysis=broker; // The real Locate path must not force a UI-intent epoch.|
          |+        // Keep the full root off the Windows Debug shell test thread's stack.|
          |+        auto root=std::make_unique<ui::AdiRootComponent>(|
          |+            document->view(),document->ops(),document->mailbox(),commands,|
          |+            document->views(),document->sessionState(),name);|
          |+        root->sharedAnalysis=broker; // The real Locate path must not force a UI-intent epoch.|
          |         auto &transport=document->session().transport();|
          |         transport.play(seek!=Seek::Parked);|
          |         // Default tempo120 and PPQ divisible by3/4 represent8000/30000|
          |@@ -251,7 +253,7 @@ inline void run(ui::AppCommands &commands,const std::filesystem::path &directory|
          |             const auto current=document->view().current();|
          |             const auto target=static_cast<std::int64_t>(current->tempo->ticksToSeconds(targetTick)*48000.);|
          |             expect(target==(seek==Seek::Distant?30000:8000),"seek fixture's authored tick maps to its exact heard sample");|
          |-            expect(root.locate(targetTick),"actual root Locate posts while the old callback is blocked");|
          |+            expect(root->locate(targetTick),"actual root Locate posts while the old callback is blocked");|
          |             gate->oldSignal.store(false,std::memory_order_release);|
          |             blocked.finish();|
          |             broker->pump();|
          |@@ -294,7 +296,7 @@ inline void run(ui::AppCommands &commands,const std::filesystem::path &directory|
          |             expect(suspend?after==targetCalls:after>targetCalls,|
          |                    "the selected active/suspended graph tap path is actually exercised");|
          |         }|
          |-        analysis.reset();broker->shutdown();root.sharedAnalysis.reset();|
          |+        analysis.reset();broker->shutdown();root->sharedAnalysis.reset();|
          |     }|
          |     engineLease.reset();document->session().collectScopeTaps();document->release();|
          | }|
          PATCH
          git apply --index "$RUNNER_TEMP/recording-seek.patch"
          test "$(git write-tree)" = 9487c5d25ab8471d347c23bf4fc3d6d47afa307a
          echo "Verified source tree for 45533c9c0962508f8dd44998e68d0e45412a3b94 plus the latest Windows landing 90f4091d"
      - name: Install the Linux JUCE development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Fetch the pinned ADI dependencies
        run: bash adi_daw/tools/fetch_external.sh --with-juce
      - name: Build Debug UI tests with ASan and UBSan
        shell: bash
        run: |
          flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake -S adi_daw -B "$RUNNER_TEMP/adi" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DADI_WITH_JUCE=ON -DADI_WITH_PD=OFF -DADI_WERROR=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_C_FLAGS_DEBUG=-O0 -g1" "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g1 -fno-var-tracking-assignments" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined -no-pie" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined"
          mapfile -t suites < <(ninja -C "$RUNNER_TEMP/adi" -t targets all | sed -nE 's/^(adi_ui_[a-z0-9_]+_tests):.*/\1/p' | sort -u)
          test "${#suites[@]}" -ge 15
          cmake --build "$RUNNER_TEMP/adi" --parallel 2 --target "${suites[@]}"
      - name: Run the UI suites with DISPLAY unset
        run: env -u DISPLAY -u WAYLAND_DISPLAY ADI_HOME="$RUNNER_TEMP/adi-test-home" ctest --test-dir "$RUNNER_TEMP/adi" -R '^adi_ui_' --output-on-failure --timeout 1800
