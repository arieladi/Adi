      - name: Install Linux JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxrandr-dev libxinerama-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Fetch pinned ADI dependencies
        run: bash adi_daw/tools/fetch_external.sh --with-juce
      - name: Build Debug UI tests
        shell: bash
        run: |
          cmake -S adi_daw -B "$RUNNER_TEMP/adi" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DADI_WITH_JUCE=ON -DADI_WITH_PD=OFF -DADI_WERROR=ON \
            "-DCMAKE_C_FLAGS_DEBUG=-O0 -g1" "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g1 -fno-var-tracking-assignments"
          mapfile -t suites < <(ninja -C "$RUNNER_TEMP/adi" -t targets all | sed -nE 's/^(adi_ui_[a-z0-9_]+_tests):.*/\1/p' | sort -u)
          test "${#suites[@]}" -ge 15
          cmake --build "$RUNNER_TEMP/adi" --parallel 2 --target "${suites[@]}" adi_audio_recording_tests adi_recording_commands_tests adi_midi_capture_tests adi_cue_monitor_tests adi_transport_tests adi_settings_tests
      - name: Run every UI suite with DISPLAY unset
        run: env -u DISPLAY -u WAYLAND_DISPLAY ADI_HOME="$RUNNER_TEMP/adi-test-home" ctest --test-dir "$RUNNER_TEMP/adi" -R '^adi_ui_' --output-on-failure --timeout 1800

      - name: Run the recording and transport fixtures
        run: env -u DISPLAY -u WAYLAND_DISPLAY ADI_HOME="$RUNNER_TEMP/adi-recording-home" ctest --test-dir "$RUNNER_TEMP/adi" -R '^adi_(audio_recording|recording_commands|midi_capture|cue_monitor|transport|settings)_tests$' --output-on-failure
