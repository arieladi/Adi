<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' blob: data:; connect-src ws: wss: 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:;" />
  <title>Adi Studio OS — plugin host</title>
  <style>
    html,body{margin:0;background:#0c0f12;color:#6b7682;font:11px/1.5 ui-monospace,Menlo,monospace}
    .h{padding:12px}
    b{color:#e8edf2}
  </style>
</head>
<body>
  <div class="h">
    <b>Adi Studio OS</b> — Stream Deck plugin host (offscreen).<br />
    Surface: 36 keys + 6 dials · Stream Deck + XL.<br />
    Backend service: <code>ws://127.0.0.1:9011</code> · Ableton bridge: <code>ws://127.0.0.1:9006</code>
  </div>

  <!-- Load order matters: each file augments window.SOS and reads the ones above it. -->

  <!-- core: no dependencies on modules -->
  <script src="js/core/sd-client.js"></script>
  <script src="js/core/timing.js"></script>
  <script src="js/core/surface.js"></script>
  <script src="js/core/art.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/core/ipc.js"></script>
  <script src="js/core/layout.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/nav.js"></script>
  <script src="js/core/states.js"></script>

  <!-- modules: each registers screens/overlays, none touch the global rules -->
  <script src="js/modules/root.js"></script>
  <script src="js/modules/console.js"></script>
  <script src="js/modules/rekordbox.js"></script>
  <script src="js/modules/midictl.js"></script>
  <script src="js/modules/viz.js"></script>

  <!-- Ableton: the compat layer FIRST (it defines AVC.DeviceController and
       AVC.registry), then the controllers copied byte-for-byte from
       adi_ableton_vst_controller 1.5.9.0, then their registry. -->
  <script src="js/modules/ableton.js"></script>
  <script src="js/ableton/svg.js"></script>
  <script src="js/ableton/GenericController.js"></script>
  <script src="js/ableton/EQ8Controller.js"></script>
  <script src="js/ableton/PulsarMassiveController.js"></script>
  <script src="js/ableton/ProQ3Controller.js"></script>
  <script src="js/ableton/SpectreController.js"></script>
  <script src="js/ableton/IndeqController.js"></script>
  <script src="js/ableton/ValhallaRoomController.js"></script>
  <script src="js/ableton/ValhallaVintageVerbController.js"></script>
  <script src="js/ableton/BlackholeController.js"></script>
  <script src="js/ableton/HDelayController.js"></script>
  <script src="js/ableton/DbCompController.js"></script>
  <script src="js/ableton/OmnipressorController.js"></script>
  <script src="js/ableton/SaturateController.js"></script>
  <script src="js/ableton/SideMinderController.js"></script>
  <script src="js/ableton/registry.js"></script>
  <script src="js/modules/plugins.js"></script>
  <script src="js/modules/index.js"></script>

  <!-- orchestrator last: defines connectElgatoStreamDeckSocket -->
  <script src="js/plugin.js"></script>
</body>
</html>
