name = "finance"
main = "src/index.js"
compatibility_date = "2026-08-01"
# Required by @kenjiuno/msgreader (.msg / Outlook Compound File parsing), which pulls in
# node:buffer and node:string_decoder. Without this the build fails to resolve them.
compatibility_flags = ["nodejs_compat"]
account_id = "84bfab8d23e7751df724a1ee31dcfcc6"

# Private financial API — do not mint per-version public preview URLs.
preview_urls = false

# Same-origin API. adiariel.com is proxied, so this route intercepts /api/*
# before it reaches GitHub Pages; Pages still serves everything else.
# Same origin means Cloudflare Access can attach the caller's identity to these
# requests, which is what lets the UI drop its token prompt.
[[routes]]
pattern = "adiariel.com/api/*"
zone_name = "adiariel.com"

# Structured logs + traces in the dashboard (Workers Observability).
[observability]
enabled = true

# --- D1: financial records -------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "finance"
database_id = "e90ec1a7-be5f-4faf-9ecf-bc2981ff2fe2"
# The d1_migrations ledger IS the idempotency, at file granularity — which is why the
# ALTER statements need no IF NOT EXISTS gymnastics (SQLite has no such form anyway).
# schema.sql is now only the fresh-database baseline; migrations are the source of truth.
migrations_dir = "migrations"
migrations_table = "d1_migrations"

# --- R2: private document store (never public) -----------------------------
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "adi-docs"

# --- Workers AI: dashboard insights ----------------------------------------
[ai]
binding = "AI"

# Two schedules, deliberately:
#   */2  — drains the ingestion queue. This is the DELIVERY GUARANTEE for bulk forwards:
#          the webhook only enqueues, and this tick keeps taking a couple of attachments
#          at a time until the backlog is empty, however large the email was. Without a
#          frequent trigger a 40-payslip forward would sit until 03:17.
#   17 3 — nightly maintenance: purge 30-day-old soft deletes, due-date alerts, Google pull.
[triggers]
crons = ["*/2 * * * *", "17 3 * * *"]

# Outbound mail goes through Resend (RESEND_API_KEY secret), not Cloudflare Email
# Sending — no domain onboarding step, and the DNS records are already verified.

[vars]
# Gemini model for Hebrew document extraction, tried in order — Google retires
# models continuously and ListModels over-reports (it advertises models that
# generateContent then 404s), so the worker walks this chain on 404/429.
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_FALLBACKS = "gemini-flash-latest,gemini-3.5-flash,gemini-2.0-flash"
# Workers AI model for insights. First that responds wins (see AI_FALLBACKS).
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_FALLBACKS = "@cf/qwen/qwen3-30b-a3b-fp8,@cf/meta/llama-3.1-8b-instruct"
ALLOWED_ORIGINS = "https://adiariel.com,https://www.adiariel.com,https://arieladi.github.io,http://localhost:8801,http://127.0.0.1:8801"

# Outbound mail. Overridable without a code change.
MAIL_FROM = "Adi Hub <office@adiariel.com>"
MAIL_TO = "adidatabase@gmail.com"

# NOTE: there is deliberately NO salary ceiling here any more. A hard limit cannot tell a real
# bonus from a misread gross, and it quarantined legitimate high months. A questionable payslip
# is now detected from the document's OWN arithmetic (gross − deductions ≈ net) and STAGED for
# confirmation through the finance command line — see migration 0016.

# --- Microsoft Graph / Office 365 calendar ---------------------------------
# The IDs and the secret are SECRETS, not vars — see the list at the bottom of this file.
# This date is not sensitive and has to be editable, so it lives here: the nightly cron
# warns at 90/60/30/14/7/3/1/0 days out, once per threshold, because an expired client
# secret fails invisibly (the calendar works for up to an hour on a cached access token,
# then every refresh returns AADSTS7000222).
# UPDATE THIS whenever you rotate MICROSOFT_CLIENT_SECRET, or the warnings stop matching
# reality — and delete the ms_secret_alert_* rows from `settings` so they can fire again.
MICROSOFT_SECRET_EXPIRES = "2028-08-03"

# --- Cloudflare Access -----------------------------------------------------
# When both are set, a valid Access JWT authenticates a request and the UI stops
# asking for a token. Leave blank to fall back to Bearer-only.
#   ACCESS_TEAM_DOMAIN — Zero Trust > Settings > Custom Pages (e.g. "adiariel")
#   ACCESS_AUD         — Access > Applications > your app > Overview > AUD tag
# NOTE: if you rename the team domain in Zero Trust > Settings, update this —
# it is the JWT issuer, and a mismatch silently falls back to the token prompt.
ACCESS_TEAM_DOMAIN = "wild-band-1bba"
ACCESS_AUD = "4f55ba0a1eeb3be3c6365cadb2e3f4e7bfe59c3b010a53359104144698d72fce"

# Secrets (set with `npx wrangler secret put <NAME> --name finance`):
#   GEMINI_API_KEY  — already set
#   API_TOKEN       — REQUIRED. The worker fails closed (503) without it.
#   MICROSOFT_CLIENT_ID / MICROSOFT_TENANT_ID / MICROSOFT_CLIENT_SECRET
#                   — Entra ID app "Hub Calendar". The two IDs are not secret in themselves,
#                     but they are kept here rather than in [vars] so no Microsoft
#                     credential of any kind is committed to a public repo.
# Local values for all of these live in finance/.dev.vars, which is gitignored.
